name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (max. 5 Warnings, Standing Audit)
        run: npm run lint -- --max-warnings 5

      - name: Unit-Tests mit Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle-Groesse melden (Standing Audit)
        run: |
          echo "### Bundle (gzip)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find dist/assets -name '*.js' -print0 | while IFS= read -r -d '' file; do
            printf '%-48s %6s KB\n' "$(basename "$file")" "$(gzip -c "$file" | wc -c | awk '{printf "%.1f", $1/1024}')" >> "$GITHUB_STEP_SUMMARY"
          done
          total=$(find dist/assets -name '*.js' -exec cat {} + | gzip -c | wc -c)
          printf '%-48s %6s KB\n' "GESAMT JS" "$(awk -v b="$total" 'BEGIN{printf "%.1f", b/1024}')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (Mobile-Emulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Flow
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
