<?xml version="1.0" encoding="UTF-8"?>
<!--
  App-/PWA-Icon (Art Direction §10): Shotling-Kopf mit Fadenkreuz ueber dem Auge.
  512x512, maskable — der Kopf bleibt innerhalb der sicheren Zone (Radius 40 % = 205 px).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0F0E1A"/>
  <circle cx="256" cy="256" r="205" fill="#FFB800"/>

  <!-- Kopf: runde Bohne mit Ohren-Bumps, dicke ink-Outline -->
  <g stroke="#1A1024" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="188" cy="262" rx="22" ry="28" fill="#FFF8E7"/>
    <ellipse cx="324" cy="262" rx="22" ry="28" fill="#FFF8E7"/>
    <ellipse cx="256" cy="258" rx="118" ry="112" fill="#FFF8E7"/>
  </g>

  <!-- Augen -->
  <ellipse cx="214" cy="244" rx="30" ry="34" fill="#FFFFFF" stroke="#1A1024" stroke-width="10"/>
  <ellipse cx="300" cy="244" rx="30" ry="34" fill="#FFFFFF" stroke="#1A1024" stroke-width="10"/>
  <circle cx="218" cy="250" r="14" fill="#1A1024"/>
  <circle cx="304" cy="250" r="14" fill="#1A1024"/>

  <!-- erschrockener Mund -->
  <ellipse cx="257" cy="318" rx="26" ry="20" fill="#1A1024"/>

  <!-- Fadenkreuz ueber dem rechten Auge -->
  <g stroke="#FF2D55" stroke-width="12" stroke-linecap="round" fill="none">
    <circle cx="300" cy="244" r="58"/>
    <path d="M300 158 v40 M300 290 v40 M214 244 h40 M346 244 h40"/>
  </g>
  <circle cx="300" cy="244" r="7" fill="#FF2D55"/>
</svg>
